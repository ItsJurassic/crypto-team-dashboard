function relTime(at,now){
  const sec=Math.max(0,Math.floor((now-at)/1000));
  if(sec<45)return "just now";
  if(sec<3600)return Math.floor(sec/60)+"m ago";
  if(sec<86400)return Math.floor(sec/3600)+"h ago";
  return Math.floor(sec/86400)+"d ago";

function iso(x,y,z,ox,oy){return {x:(x-y)*TILE+ox,y:(x+y)*RISE-z*RISE+oy}}
function pts(list){return list.map(p=>p.x+","+p.y).join(" ")}
function statusColor(s){return s==="working"?"#22e08a":s==="waiting"?"#ffb020":s==="error"?"#ff4d5e":"#94a3b8"}
function mixHex(hex,other,t){
  const parse=h=>{h=String(h).replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
  const a=parse(hex),b=parse(other);
  return "#"+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,"0")).join("");
}
function faces(fill){
  return {
    top:mixHex(fill,"#ffffff",0.38),
    left:mixHex(fill,"#000000",0.14),
    right:mixHex(fill,"#000000",0.34),
    deep:mixHex(fill,"#000000",0.48),
    edge:mixHex(fill,"#1a120c",0.42),

  };
}
function isoBox(x,y,z,w,d,h,ox,oy,top,left,right,stroke){
  const t1=iso(x,y,z+h,ox,oy),t2=iso(x+w,y,z+h,ox,oy),t3=iso(x+w,y+d,z+h,ox,oy),t4=iso(x,y+d,z+h,ox,oy);
  const l1=iso(x,y,z,ox,oy),l2=iso(x,y+d,z,ox,oy),r1=iso(x+w,y+d,z,ox,oy);
  return `<g>
    <polygon points="${pts([t1,t2,t3,t4])}" fill="${top}" stroke="${stroke}" stroke-width="0.7" stroke-linejoin="round"/>
    <polygon points="${pts([t1,t4,l2,l1])}" fill="${left}" stroke="${stroke}" stroke-width="0.7" stroke-linejoin="round"/>
    <polygon points="${pts([t4,t3,r1,l2])}" fill="${right}" stroke="${stroke}" stroke-width="0.7" stroke-linejoin="round"/>

}

function animateShift(){

  shiftTgt=(5-S.floor)*20;
  const step=()=>{
    const next=shiftCur+(shiftTgt-shiftCur)*0.16;
    if(Math.abs(shiftTgt-next)<0.08){shiftCur=shiftTgt;S.shift=shiftTgt;document.getElementById("stack").style.transform="translateY(-"+S.shift+"%)";return}
    shiftCur=next;S.shift=next;
    document.getElementById("stack").style.transform="translateY(-"+S.shift+"%)";
    raf=requestAnimationFrame(step);
  };
  raf=requestAnimationFrame(step);
}

    if(["INPUT","TEXTAREA"].includes((e.target||{}).tagName))return;
    const step=28;
    if(e.key==="w"||e.key==="W"||e.key==="ArrowUp"){CAM.y+=step;applyCam()}
    else if(e.key==="s"||e.key==="S"||e.key==="ArrowDown"){CAM.y-=step;applyCam()}
    else if(e.key==="a"||e.key==="A"||e.key==="ArrowLeft"){CAM.x+=step;applyCam()}
    else if(e.key==="d"||e.key==="D"||e.key==="ArrowRight"){CAM.x-=step;applyCam()}
    else if(e.key==="0"||e.key==="r"||e.key==="R"){CAM.x=0;CAM.y=0;CAM.z=1;CAM.rot=0;applyCam()}
    else if(e.key>="1"&&e.key<="5"){S.floor=+e.key;paint();animateShift()}
  });
})();
setInterval(()=>{const n=Date.now();S.nowMs=n;S.clock=fmtCT(new Date(n));const el=document.getElementById("clock");if(el)el.textContent=S.clock;},30000);
setInterval(()=>{
  const n=Date.now();
  S.equity=2840+Math.round((n/7000)%16);
  S.scans=14+Math.round((n/4000)%19);
  const eq=document.getElementById("mon-equity");
  const sc=document.getElementById("mon-scans");
  if(eq) eq.textContent="$"+S.equity.toLocaleString("en-US");
  if(sc) sc.textContent="SCANS "+S.scans+" live";
},2200);
setInterval(()=>{const line=AMBIENCE[amb%AMBIENCE.length];amb++;S.feed=[{id:"live-"+Date.now(),text:line,at:Date.now()},...S.feed].slice(0,16);paintChrome()},16000);
paint();
setTour();
animateShift();
})();

</script>
