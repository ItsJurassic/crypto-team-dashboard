function fmtCT(d){
  return new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).format(d)+" CT";
}
function relTime(at,now){
  const sec=Math.max(0,Math.floor((now-at)/1000));
  if(sec<45)return "just now";
  if(sec<3600)return Math.floor(sec/60)+"m ago";
  if(sec<86400)return Math.floor(sec/3600)+"h ago";
  return Math.floor(sec/86400)+"d ago";
}
function iso(x,y,z,ox,oy){return {x:(x-y)*TILE+ox,y:(x+y)*RISE-z*RISE+oy}}
function pts(list){return list.map(p=>p.x+","+p.y).join(" ")}
function statusColor(s){return s==="working"?"#22e08a":s==="waiting"?"#ffb020":s==="error"?"#ff4d5e":"#7b8594"}
function mixHex(hex,other,t){
  const parse=h=>{h=String(h).replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
  const a=parse(hex),b=parse(other);
  return "#"+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,"0")).join("");
}
function faces(fill){
  return {
    top:mixHex(fill,"#ffffff",0.34),
    left:mixHex(fill,"#000000",0.16),
    right:mixHex(fill,"#000000",0.38),
    deep:mixHex(fill,"#000000",0.5),
    edge:mixHex(fill,"#1a120c",0.52),
    mid:fill
  };
}
function isoBox(x,y,z,w,d,h,ox,oy,top,left,right,stroke){
  const t1=iso(x,y,z+h,ox,oy),t2=iso(x+w,y,z+h,ox,oy),t3=iso(x+w,y+d,z+h,ox,oy),t4=iso(x,y+d,z+h,ox,oy);
  const l1=iso(x,y,z,ox,oy),l2=iso(x,y+d,z,ox,oy),r1=iso(x+w,y+d,z,ox,oy);
  return `<g>
    <polygon points="${pts([t1,t2,t3,t4])}" fill="${top}" stroke="${stroke}" stroke-width="0.85" stroke-linejoin="round"/>
    <polygon points="${pts([t1,t4,l2,l1])}" fill="${left}" stroke="${stroke}" stroke-width="0.85" stroke-linejoin="round"/>
    <polygon points="${pts([t4,t3,r1,l2])}" fill="${right}" stroke="${stroke}" stroke-width="0.85" stroke-linejoin="round"/>
  </g>`;
}
function isoPyramid(x,y,z,w,d,h,ox,oy,fill){
  const f=faces(fill);
  const apex=iso(x+w/2,y+d/2,z+h,ox,oy);
  const nw=iso(x,y,z,ox,oy), ne=iso(x+w,y,z,ox,oy);
  const se=iso(x+w,y+d,z,ox,oy), sw=iso(x,y+d,z,ox,oy);
  return `<g>
    <polygon points="${pts([apex,nw,sw])}" fill="${f.left}" stroke="${f.edge}" stroke-width="0.9" stroke-linejoin="round"/>
    <polygon points="${pts([apex,sw,se])}" fill="${f.right}" stroke="${f.edge}" stroke-width="0.9" stroke-linejoin="round"/>
    <polygon points="${pts([apex,ne,nw])}" fill="${f.top}" stroke="${f.edge}" stroke-width="0.9" stroke-linejoin="round"/>
  </g>`;
}
function isoSphere(cx,cy,r,fill){
  const f=faces(fill);
  return `<g>
    <ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*0.94}" fill="${f.right}"/>
    <ellipse cx="${cx-r*0.07}" cy="${cy-r*0.06}" rx="${r*0.9}" ry="${r*0.86}" fill="${fill}"/>
    <ellipse cx="${cx}" cy="${cy+r*0.28}" rx="${r*0.72}" ry="${r*0.5}" fill="${f.deep}" opacity="0.22"/>
    <ellipse cx="${cx-r*0.34}" cy="${cy-r*0.4}" rx="${r*0.38}" ry="${r*0.26}" fill="#fff" opacity="0.48"/>
    <ellipse cx="${cx-r*0.18}" cy="${cy-r*0.22}" rx="${r*0.16}" ry="${r*0.1}" fill="#fff" opacity="0.38"/>
  </g>`;
}
function isoCylinder(cx,yTop,yBot,rx,ry,fill){
  const f=faces(fill);
  return `<g>
    <path d="M ${cx-rx} ${yTop} L ${cx-rx} ${yBot} A ${rx} ${ry} 0 0 0 ${cx+rx} ${yBot} L ${cx+rx} ${yTop} A ${rx} ${ry} 0 0 1 ${cx-rx} ${yTop}" fill="${f.left}" stroke="${f.edge}" stroke-width="0.8"/>
    <ellipse cx="${cx}" cy="${yBot}" rx="${rx}" ry="${ry}" fill="${f.right}" stroke="${f.edge}" stroke-width="0.6"/>
    <ellipse cx="${cx}" cy="${yTop}" rx="${rx}" ry="${ry}" fill="${f.top}" stroke="${f.edge}" stroke-width="0.85"/>
    <ellipse cx="${cx-rx*0.22}" cy="${yTop-ry*0.12}" rx="${rx*0.42}" ry="${ry*0.32}" fill="#fff" opacity="0.34"/>
  </g>`;
}
function isoDiamond(cx,cy,r,fill){
  const f=faces(fill);
  const top={x:cx,y:cy-r*1.22}, bot={x:cx,y:cy+r*1.18};
  const L={x:cx-r*0.98,y:cy+r*0.1}, R={x:cx+r*0.98,y:cy+r*0.1};
  const fm={x:cx+r*0.04,y:cy+r*0.32};
  return `<g>
    <polygon points="${top.x},${top.y} ${L.x},${L.y} ${fm.x},${fm.y}" fill="${f.left}" stroke="${f.edge}" stroke-width="0.85" stroke-linejoin="round"/>
    <polygon points="${top.x},${top.y} ${fm.x},${fm.y} ${R.x},${R.y}" fill="${f.top}" stroke="${f.edge}" stroke-width="0.85" stroke-linejoin="round"/>
    <polygon points="${L.x},${L.y} ${bot.x},${bot.y} ${fm.x},${fm.y}" fill="${f.right}" stroke="${f.edge}" stroke-width="0.85" stroke-linejoin="round"/>
    <polygon points="${fm.x},${fm.y} ${bot.x},${bot.y} ${R.x},${R.y}" fill="${f.deep}" stroke="${f.edge}" stroke-width="0.85" stroke-linejoin="round"/>
    <polygon points="${top.x},${top.y} ${cx-r*0.22},${cy-r*0.2} ${cx+r*0.28},${cy-r*0.12}" fill="#fff" opacity="0.3"/>
  </g>`;
}
function isoStar(cx,cy,r,fill){
  const f=faces(fill);
  const dx=8, dy=7, front=[], back=[];
  for(let i=0;i<10;i++){
    const rad=i%2===0?r:r*0.4;
    const a=-Math.PI/2+(i*Math.PI)/5;
    const x=cx+Math.cos(a)*rad, y=cy+Math.sin(a)*rad;
    front.push({x,y}); back.push({x:x+dx,y:y+dy});
  }
  let html="<g>";
  for(let i=0;i<10;i++){
    const a=front[i], b=front[(i+1)%10], c=back[(i+1)%10], d=back[i];
    html+=`<polygon points="${a.x},${a.y} ${b.x},${b.y} ${c.x},${c.y} ${d.x},${d.y}" fill="${i%2?f.right:f.left}" stroke="${f.edge}" stroke-width="0.35"/>`;
  }
  html+=`<polygon points="${back.map(p=>p.x+","+p.y).join(" ")}" fill="${f.deep}"/>`;
  html+=`<polygon points="${front.map(p=>p.x+","+p.y).join(" ")}" fill="${f.mid}" stroke="${f.edge}" stroke-width="0.9" stroke-linejoin="round"/>`;
  html+=`<ellipse cx="${cx-r*0.12}" cy="${cy-r*0.22}" rx="${r*0.22}" ry="${r*0.12}" fill="#fff" opacity="0.28"/>`;
  return html+"</g>";
}

function shapeAt(agent,gx,gy,ox,oy,fill){
  const z0=1.28;
  const head=iso(gx+0.62,gy+0.38,z0+0.95,ox,oy);

  if(shape==="cube"){
    const f=faces(fill);
    return isoBox(gx+0.18,gy+0.04,z0,1.02,1.02,1.02,ox,oy,f.top,f.left,f.right,f.edge);
  }
  if(shape==="pyramid") return isoPyramid(gx+0.16,gy+0.02,z0,1.12,1.12,1.42,ox,oy,fill);
  if(shape==="cylinder"){
    const top=iso(gx+0.62,gy+0.4,z0+1.42,ox,oy);
    const bot=iso(gx+0.62,gy+0.4,z0,ox,oy);
    return isoCylinder(top.x, top.y, bot.y, 22, 11, fill);
  }
  if(shape==="sphere") return isoSphere(head.x, head.y, 27, fill);
  if(shape==="diamond") return isoDiamond(head.x, head.y, 28, fill);
  return isoStar(head.x, head.y, 27, fill);
}

    <div class="ofc-side-body"><div class="ofc-h">Floors</div>`+FLOORS.map(f=>{
    const n=f.id===5?4:S.agents.filter(a=>a.floor===f.id&&a.status==="working").length;
    return `<button type="button" class="ofc-fb ${S.floor===f.id?"on":""}" data-floor="${f.id}"><b>${f.id} · ${esc(f.name)}</b><span>${n} ${f.id===5?"in meeting":"working"} · ${esc(f.blurb)}</span></button>`;
  }).join("")+`
    <div class="ofc-h ofc-wait">Waiting on me · ${w.length}</div>
    ${w.map(a=>`<div class="ofc-waititem"><div class="nm">${esc(a.name)}</div><div class="rs">${esc(a.waitReason)}</div><button type="button" class="ofc-btn" data-ok="${a.id}">Approve</button></div>`).join("")}
    <button type="button" class="ofc-btn quiet" style="width:100%;margin-top:8px" data-tog="fin">Finished · ${S.finished.length}</button>
    ${S.openFinished?`<div style="margin-top:8px">${S.finished.map(item=>`<div class="ofc-cap">${esc(item)}</div>`).join("")}</div>`:""}
    <button type="button" class="ofc-btn quiet" style="width:100%;margin-top:8px" data-tog="rtn">Routines · ${ROUTINES.length}</button>
    ${S.openRoutines?`<div style="margin-top:8px">${ROUTINES.map(item=>`<div class="ofc-cap">${esc(item)}</div>`).join("")}</div>`:""}
    </div>`;
  const meta=FLOORS.find(f=>f.id===S.floor);
  const onFloor=S.floor===5?MEET.map(m=>{const src=S.agents.find(a=>a.id===m.id)||{};return {id:m.id,name:m.name,task:m.text,status:src.status||"working",helper:false}}):S.agents.filter(a=>a.floor===S.floor);
  const sel=S.agents.find(a=>a.id===S.selectedId)||S.agents[0];
  const right=document.getElementById("right");
  right.classList.toggle("collapsed", !S.rightOpen);
  right.innerHTML=`<button type="button" class="ofc-collapse" data-tog="right">${S.rightOpen?"Hide details ⟩":"⟨"}</button>
    <div class="ofc-side-body">
    <div class="ofc-h">Floor ${meta.id} · ${esc(meta.name)}</div>
    <div class="ofc-cap">${esc(meta.blurb)}</div>
    ${onFloor.map(a=>`<button type="button" class="ofc-ab ${S.selectedId===a.id?"on":""}" data-pick="${a.id}">
      <b><span class="ofc-dot" style="background:${statusColor(a.status)}"></span>${esc(a.name)}${a.helper?` <span style="color:var(--mut);font-weight:500">desk helper</span>`:""}</b>
      <span>${esc(a.task)}</span>
    </button>`).join("")}
    <div class="ofc-snap">
      <div class="lab">Weekly goal · snapshot</div>
      <p>Cookies this month: 5</p>
      <p>Improvement path: 12%</p>
      <p>Team book: ~$2,847 / $3,000</p>
      <p class="note">Embedded snapshot from Thu Nov 5, 2026 EOD — not live market data. Fake money only. Cookies never convert to usage without asking.</p>
    </div>
    ${sel?`<div class="ofc-sel"><div class="ofc-cap">Selected</div><div style="font-weight:650">${esc(sel.name)}</div><div class="ofc-cap">${esc(sel.task)}</div></div>`:""}
    <div class="ofc-feed"><div class="ofc-h">Activity</div>${S.feed.map(item=>`
      <div class="ofc-row"><time>${relTime(item.at,S.nowMs)}</time><span>${esc(item.text)}</span></div>`).join("")}</div>
    </div>`;
}

function paint(){paintChrome();paintScene()}

function animateShift(){
  cancelAnimationFrame(raf);
  shiftTgt=(5-S.floor)*20;
  const step=()=>{
    const next=shiftCur+(shiftTgt-shiftCur)*0.16;
    if(Math.abs(shiftTgt-next)<0.08){shiftCur=shiftTgt;S.shift=shiftTgt;document.getElementById("stack").style.transform="translateY(-"+S.shift+"%)";return}
    shiftCur=next;S.shift=next;
    document.getElementById("stack").style.transform="translateY(-"+S.shift+"%)";
    raf=requestAnimationFrame(step);
  };
  raf=requestAnimationFrame(step);
}

document.getElementById("office").addEventListener("click",e=>{
  const t=e.target.closest("[data-mode],[data-floor],[data-view],[data-ok],[data-pick],[data-tog]");
  if(!t)return;
  if(t.dataset.mode){
    S.mode=t.dataset.mode;
    if(S.mode==="day"||S.mode==="night") S.theme=S.mode;
    if(S.mode==="meeting"){S.floor=5}
    persist(); setTour(); paint(); if(S.mode==="meeting") animateShift();
    return;
  }
  if(t.dataset.floor){S.floor=+t.dataset.floor; if(S.floor===5) S.mode="meeting"; else if(S.mode==="meeting") S.mode=S.theme; persist(); paint(); animateShift(); return}
  if(t.dataset.view){viewAgent(t.dataset.view); animateShift(); return}
  if(t.dataset.ok){approve(t.dataset.ok); return}
  if(t.dataset.pick){S.selectedId=t.dataset.pick;const who=S.agents.find(a=>a.id===t.dataset.pick);if(who && S.floor!==5)S.floor=who.floor;paint();animateShift();return}
  if(t.dataset.tog==="fin"){S.openFinished=!S.openFinished;paintChrome();return}
  if(t.dataset.tog==="rtn"){S.openRoutines=!S.openRoutines;paintChrome();return}
  if(t.dataset.tog==="left"){S.leftOpen=!S.leftOpen;paintChrome();return}
  if(t.dataset.tog==="right"){S.rightOpen=!S.rightOpen;paintChrome()}
});

function setTour(){
  clearInterval(tourId);
  if(S.mode!=="tour")return;
  tourId=setInterval(()=>{
    const order=[5,4,3,2,1];
    const i=order.indexOf(S.floor);
    S.floor=order[(i<0?0:i+1)%order.length];
    paint(); animateShift();
  },4200);
}

setInterval(()=>{const n=Date.now();S.nowMs=n;S.clock=fmtCT(new Date(n));document.getElementById("clock").textContent="Sunny AI team desk · "+S.clock;paintChrome()},30000);
setInterval(()=>{
  const n=Date.now();
  S.equity=2840+Math.round((n/7000)%16);
  S.scans=14+Math.round((n/4000)%19);
  const eq=document.getElementById("mon-equity");
  const sc=document.getElementById("mon-scans");
  if(eq) eq.textContent="$"+S.equity.toLocaleString("en-US");
  if(sc) sc.textContent=S.scans+" live";
},2200);
setInterval(()=>{const line=AMBIENCE[amb%AMBIENCE.length];amb++;S.feed=[{id:"live-"+Date.now(),text:line,at:Date.now()},...S.feed].slice(0,16);paintChrome()},16000);

paint();
setTour();
animateShift();
})();
</script>
