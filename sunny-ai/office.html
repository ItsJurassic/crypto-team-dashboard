  return new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",hour:"numeric",minute:"2-digit"}).format(d)+" CT";
}
function relTime(at,now){
  const sec=Math.max(0,Math.floor((now-at)/1000));
  if(sec<45)return "just now";
  if(sec<3600)return Math.floor(sec/60)+"m ago";
  if(sec<86400)return Math.floor(sec/3600)+"h ago";
  return Math.floor(sec/86400)+"d ago";
}
function iso(x,y,z,ox,oy){return {x:(x-y)*TILE+ox,y:(x+y)*RISE-z*RISE+oy}}
function pts(list){return list.map(p=>p.x+","+p.y).join(" ")}
function isIdle(s){s=typeof s==="string"?s:(s&&s.status);return s==="idle"||s==="done"}
function statusColor(s){return s==="working"?"#22e08a":s==="waiting"?"#ffb020":s==="error"?"#ff4d5e":isIdle(s)?"#3b82f6":"#94a3b8"}
function statusCaption(a){
  if(!a) return "";
  if(isIdle(a.status)) return "Done · idle — the blue ✓ means this bot finished and is walking the office";

  if(a.status==="waiting") return "Needs you · ! — waiting for Approve";
  if(a.status==="resting") return "Resting in the lounge · z";
  if(a.status==="error") return "Something broke · needs a look";

function mixHex(hex,other,t){
  const parse=h=>{h=String(h).replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
  const a=parse(hex),b=parse(other);
  return "#"+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,"0")).join("");
}
function faces(fill){
  return {
    top:mixHex(fill,"#ffffff",0.38),
    left:mixHex(fill,"#000000",0.14),
    right:mixHex(fill,"#000000",0.34),
    deep:mixHex(fill,"#000000",0.48),
    edge:mixHex(fill,"#1a120c",0.42),

  };

  {x:-6.35,z: 4.15},{x:-1.20,z: 4.25},{x: 2.40,z: 4.20},{x: 5.35,z: 3.85},
  {x: 5.45,z: 0.10},{x: 5.35,z:-3.85},{x: 1.80,z:-4.20},{x:-1.40,z:-4.20},

function pathLen(){
  let n=0;
  for(let i=0;i<WALK_PATH.length;i++){
    const a=WALK_PATH[i], b=WALK_PATH[(i+1)%WALK_PATH.length];
    n+=Math.hypot(b.x-a.x,b.z-a.z);
  }
  return n;
}
const WALK_LEN=pathLen();
function posOnPath(dist){
  let d=((dist%WALK_LEN)+WALK_LEN)%WALK_LEN;
  for(let i=0;i<WALK_PATH.length;i++){
    const a=WALK_PATH[i], b=WALK_PATH[(i+1)%WALK_PATH.length];
    const seg=Math.hypot(b.x-a.x,b.z-a.z)||0.001;
    if(d<=seg){
      const t=d/seg;
      return {x:a.x+(b.x-a.x)*t, z:a.z+(b.z-a.z)*t, dx:b.x-a.x, dz:b.z-a.z};
    }
    d-=seg;
  }
  const a=WALK_PATH[0];
  return {x:a.x,z:a.z,dx:1,dz:0};
}

function starGeo(){
  const sh=new THREE.Shape();
  for(let i=0;i<10;i++){
    const r=i%2===0?0.48:0.2;
    const a=-Math.PI/2+i*Math.PI/5;

function agentWorldPos(who){
  if(!who) return {x:0,z:0};
  if(who.status==="resting"){
    const resters=S.agents.filter(a=>a.status==="resting");
    return restSpot(Math.max(0, resters.findIndex(a=>a.id===who.id)));
  }
  if(isIdle(who.status)){
    if(who._wx!=null) return {x:who._wx,z:who._wz};
    return posOnPath(who._walkDist||0);
  }
  const pl=place3(who);
  return {x:pl.x,z:pl.z};
}

function disposeScene(){
  bobbers=[]; steams=[]; pickables=[]; walkers=[];
  if(!scene) return;
  while(scene.children.length){
    const obj=scene.children[0];
    scene.remove(obj);
    obj.traverse(c=>{
      if(c.geometry) c.geometry.dispose();
      if(c.material){
        const arr=[].concat(c.material);
        arr.forEach(m=>{ if(m&&m.map&&m.map!==tvTex) m.map.dispose(); if(m) m.dispose(); });
      }
    });
  }
}

let svgMode=false;
function measureStage(){
  const stage=document.getElementById("stage");
  if(!stage) return {w:0,h:0};
  const r=stage.getBoundingClientRect();
  const w=Math.max(r.width||0, stage.clientWidth||0);
  const h=Math.max(r.height||0, stage.clientHeight||0);
  return {w:Math.round(w), h:Math.round(h)};
}
function stageHidden(){
  return document.documentElement.classList.contains("sa-locked");
}
function resizeThree(){
  if(!renderer||!camera)return false;
  const {w,h}=measureStage();
  if(w<16||h<16) return false;
  renderer.setSize(w, h, false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  const a=w/h, f=5.15;
  camera.left=-f*a; camera.right=f*a; camera.top=f; camera.bottom=-f;
  camera.updateProjectionMatrix();
  applyCam();
  if(renderer&&scene&&camera) renderer.render(scene, camera);
  return true;
}
function hookStageResize(){
  const stage=document.getElementById("stage");
  if(!stage || stage.dataset.ro==="1") return;
  stage.dataset.ro="1";
  if(window.ResizeObserver){
    const ro=new ResizeObserver(()=>{ if(threeReady && !svgMode) resizeThree(); });
    ro.observe(stage);
  }
  window.addEventListener("resize", ()=>{ if(threeReady && !svgMode) resizeThree(); });
  const mo=new MutationObserver(()=>{
    if(!document.documentElement.classList.contains("sa-locked")){
      requestAnimationFrame(()=>{ if(threeReady && !svgMode) resizeThree(); });
    }
  });
  mo.observe(document.documentElement,{attributes:true,attributeFilter:["class"]});
}
function ensureStack(){
  const stage=document.getElementById("stage");
  if(!stage) return null;
  let stack=document.getElementById("stack");
  if(!stack){
    stage.innerHTML='<div class="ofc-stack" id="stack"></div>';
    stack=document.getElementById("stack");
  }
  return stack;
}
function paintSvgScene(){
  svgMode=true;
  applyTheme();
  const stack=ensureStack();
  if(!stack) return;
  stack.innerHTML=`<div class="ofc-fl" style="height:100%">${floorSvg(4)}</div>`;
  S.shift=0; shiftCur=0; shiftTgt=0;
  stack.style.transform="none";
  applyCam();
}
function useSvgFallback(reason){
  if(reason) console.warn("Office scene fallback:", reason);
  svgMode=true;
  try{ paintSvgScene(); }catch(err){ console.error(err); }
}
function initThree(){
  if(threeReady || svgMode) return threeReady;
  if(typeof THREE==="undefined"){ useSvgFallback("THREE missing"); return false; }
  const stage=document.getElementById("stage");
  if(!stage) return false;
  try{
    const canvas=document.createElement("canvas");
    const gl=canvas.getContext("webgl")||canvas.getContext("experimental-webgl");
    if(!gl){ useSvgFallback("WebGL unavailable"); return false; }
    renderer=new THREE.WebGLRenderer({antialias:true, alpha:false, canvas:document.createElement("canvas")});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    if(THREE.sRGBEncoding) renderer.outputEncoding=THREE.sRGBEncoding;
    renderer.setClearColor(nightOn()?0x0b0f16:0xc5d0de, 1);
    stage.innerHTML="";
    stage.appendChild(renderer.domElement);
    scene=new THREE.Scene();
    camera=new THREE.OrthographicCamera(-10,10,8,-8,0.1,80);
    threeReady=true;
    hookStageResize();
    resizeThree();
    if(!looping){ looping=true; lastTick=performance.now(); (function loop(){
      requestAnimationFrame(loop);
      if(svgMode) return;
      const now=performance.now();
      const t=now/1000;
      const dt=Math.min(0.05, (now-(lastTick||now))/1000);
      lastTick=now;
      bobbers.forEach(b=>{ if(b.mesh) b.mesh.position.y=b.baseY+Math.sin(t*2.15+b.phase)*0.032; });
      walkers.forEach(w=>{
        if(!w.mesh) return;
        w.dist=(w.dist||0)+dt*1.15;
        const here=posOnPath(w.dist);
        w.mesh.position.set(here.x, 0, here.z);
        if(Math.abs(here.dx)+Math.abs(here.dz)>0.001) w.mesh.rotation.y=Math.atan2(here.dx, here.dz);
        if(w.bot) w.bot.position.y=w.botBaseY+Math.abs(Math.sin(t*9.4+w.phase))*0.055;
        const ag=S.agents.find(a=>a.id===w.agentId);
        if(ag){ ag._walkDist=w.dist; ag._wx=here.x; ag._wz=here.z; }
      });
      steams.forEach((s,i)=>{
        const ph=(t*0.4+i*0.18)%0.5;
        s.position.y=(s.userData.y0||1.1)+ph;
        if(s.material) s.material.opacity=0.42*(1-ph/0.5);
      });
      if(renderer&&scene&&camera) renderer.render(scene, camera);
    })(); }
    [0,60,200,600,1200].forEach(ms=>setTimeout(()=>{ if(threeReady && !svgMode) resizeThree(); }, ms));
    return true;
  }catch(err){
    console.warn(err);
    useSvgFallback(err && err.message || err);
    return false;
  }
}
function applyCam(){
  if(camera){
    const target=new THREE.Vector3(-CAM.x/90, 0.4, -CAM.y/90);
    const yaw=0.82 + CAM.rot*Math.PI/180;
    const pitch=0.58;
    const dist=17;
    camera.position.set(
      target.x + Math.cos(yaw)*Math.cos(pitch)*dist,
      target.y + Math.sin(pitch)*dist,
      target.z + Math.sin(yaw)*Math.cos(pitch)*dist
    );
    camera.lookAt(target);
    camera.zoom=CAM.z;
    camera.updateProjectionMatrix();
  }
  document.querySelectorAll(".ofc-cam").forEach(el=>{
    el.style.transform=`translate(${CAM.x}px,${CAM.y}px) rotate(${CAM.rot}deg) scale(${CAM.z})`;
  });
}
function paintScene(){
  applyTheme();
  if(svgMode || typeof THREE==="undefined"){
    paintSvgScene();
    return;
  }
  try{
    if(!initThree()) return;
    if(!threeReady){ paintSvgScene(); return; }
    disposeScene();
    scene=new THREE.Scene();
    scene.background=hexCol(nightOn()?"#0b0f16":"#c5d0de");
    if(renderer) renderer.setClearColor(nightOn()?0x0b0f16:0xc5d0de, 1);
    buildRoom(1);
    addWorkFloor();
    applyCam();
    resizeThree();
    if(renderer&&scene&&camera) renderer.render(scene, camera);
  }catch(err){
    console.warn(err);
    useSvgFallback(err && err.message || err);
  }
}
function pickBot(ev){
  if(!camera||!renderer) return null;
  const rec=renderer.domElement.getBoundingClientRect();
  const m=new THREE.Vector2(((ev.clientX-rec.left)/rec.width)*2-1, -((ev.clientY-rec.top)/rec.height)*2+1);
  const ray=new THREE.Raycaster();
  ray.setFromCamera(m, camera);
  const hits=ray.intersectObjects(pickables, true);
  if(!hits.length) return null;
  let o=hits[0].object;
  while(o && !o.userData.agentId) o=o.parent;
  return o&&o.userData.agentId;
}

(function bindCam(){
  const stage=document.getElementById("stage");
  let drag=null;
  stage.addEventListener("contextmenu",e=>e.preventDefault());
  stage.addEventListener("pointerdown",e=>{
    drag={x:e.clientX,y:e.clientY,cx:CAM.x,cy:CAM.y,cr:CAM.rot,btn:e.button,moved:0};
    try{stage.setPointerCapture(e.pointerId)}catch(err){}
  });
  stage.addEventListener("pointermove",e=>{
    if(!drag)return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    drag.moved=Math.max(drag.moved, Math.hypot(dx,dy));
    if(drag.moved<4)return;
    if(drag.btn===2 || drag.btn===1){CAM.x=drag.cx+dx;CAM.y=drag.cy+dy}
    else {CAM.rot=Math.max(-38,Math.min(38,drag.cr+dx*0.18)); CAM.y=drag.cy+dy*0.4}
    applyCam();
  });
  const end=e=>{
    if(drag && drag.moved<6){
      const id=pickBot(e);
      if(id){ viewAgent(id); }
    }
    drag=null;
  };
  stage.addEventListener("pointerup",end);
  stage.addEventListener("pointercancel",()=>{drag=null});
  stage.addEventListener("wheel",e=>{
    e.preventDefault();
    CAM.z=Math.min(1.85,Math.max(0.6,CAM.z*(e.deltaY>0?0.92:1.09)));
    applyCam();
  },{passive:false});
  window.addEventListener("keydown",e=>{
    if(["INPUT","TEXTAREA"].includes((e.target||{}).tagName))return;
    const step=36;
    if(e.key==="w"||e.key==="W"||e.key==="ArrowUp"){CAM.y+=step;applyCam()}
    else if(e.key==="s"||e.key==="S"||e.key==="ArrowDown"){CAM.y-=step;applyCam()}
    else if(e.key==="a"||e.key==="A"||e.key==="ArrowLeft"){CAM.x+=step;applyCam()}
    else if(e.key==="d"||e.key==="D"||e.key==="ArrowRight"){CAM.x-=step;applyCam()}
    else if(e.key==="0"||e.key==="r"||e.key==="R"){CAM.x=0;CAM.y=0;CAM.z=1;CAM.rot=0;applyCam()}
  });
})();
