<script>

(function(){
"use strict";
const VER="1111a";

  {id:"risk",   name:"Risk Manager",          team:"Trading",  status:"working", task:"Stop and position-size checks · 7 AM, 1 PM, 7 PM CT", shape:"pyramid", tint:"#E84855"},
  {id:"ops",    name:"Ops Watchdog",          team:"Trading",  status:"working", task:"Checks every lane hourly and restarts anything stalled", shape:"sphere", tint:"#2EC4B6"},

  ops:{href:"logs.html",label:"Open the logs"}, saver:{href:"banking.html",label:"Open usage & cookies"},
  bank:{href:"banking.html",label:"Open banking"}, ads:{href:"agents.html",label:"Open Agents"},

const T=s=>Date.parse(s);
const FEED=[
  {text:"Site labels and totals fixed · team start $4,000 (Fast $1k · MAJOR $2k · Stocks $1k)",at:T("2026-11-11T11:50:00-06:00")},

function fmtCT(d){return new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",hour:"numeric",minute:"2-digit"}).format(d)+" CT";}
function relTime(at,now){const sec=Math.max(0,Math.floor((now-at)/1000));if(sec<45)return "just now";if(sec<3600)return Math.floor(sec/60)+"m ago";if(sec<86400)return Math.floor(sec/3600)+"h ago";return Math.floor(sec/86400)+"d ago";}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

  theme:"day", agents:ROSTER.map((a,i)=>({...a, seat:i})), selectedId:"fast",
  clock:fmtCT(new Date()), nowMs:Date.now(), feed:FEED, finished:FINISHED,

};
try{const saved=JSON.parse(localStorage.getItem("sunnyOfficeMode")||"{}"); if(saved.theme==="day"||saved.theme==="night") S.theme=saved.theme; else if(saved.mode==="night") S.theme="night";}catch(err){}

const CAM={x:0,y:0,z:1,rot:0};
function nightOn(){return S.theme==="night"}

const DESK_CX=-0.6, DESK_CZ=0.15, DESK_D=2.3, CHAIR_OFF=DESK_D/2+0.74;
function layout(){
  const n=S.agents.length;
  const per=Math.max(1,Math.ceil(n/2));          // back row
  const perF=Math.max(0,n-per);                   // front row
  const sp=Math.max(0.9, Math.min(1.45, 9.6/per));
  const L=per*sp+0.5;
  const scale=Math.min(1, sp/1.12);
  const seats=[];
  for(let i=0;i<n;i++){
    const back=i<per, col=back?i:i-per, cnt=back?per:perF;
    seats.push({i, face:back?1:-1, col, x:DESK_CX-(cnt-1)*sp/2+col*sp, z:DESK_CZ+(back?-CHAIR_OFF:CHAIR_OFF)});
  }
  const xL=DESK_CX-L/2-1.05, xR=DESK_CX+L/2+1.05, zB=DESK_CZ-CHAIR_OFF-1.05, zF=DESK_CZ+CHAIR_OFF+1.05;
  const path=[{x:xL,z:zF},{x:xR,z:zF},{x:xR,z:zB},{x:xL,z:zB}];
  return {n,per,perF,sp,L,scale,seats,path};
}

function posOnPath(dist){
  const path=LAY.path, len=pathLen(path);
  let d=((dist%len)+len)%len;
  for(let i=0;i<path.length;i++){
    const a=path[i], b=path[(i+1)%path.length], seg=Math.hypot(b.x-a.x,b.z-a.z)||0.001;
    if(d<=seg){const t=d/seg;return {x:a.x+(b.x-a.x)*t, z:a.z+(b.z-a.z)*t, dx:b.x-a.x, dz:b.z-a.z};}
    d-=seg;
  }

}

function addOffice(){
  LAY=layout();
  const desk=makeLongDesk(LAY.L,DESK_D); add(desk,DESK_CX,0,DESK_CZ);
  const sc=LAY.scale;
  S.agents.forEach(a=>{
    const st=LAY.seats[a.seat]; if(!st) return;
    const sp=spotOf(a), here=sp.kind==="seat";
    // chair: always present at the bot's own seat; pulled out a little when the bot is away
    const ch=makeChair(); ch.scale.setScalar(sc);
    const out=here?0:0.18;
    add(ch, st.x, 0, st.z+(st.face>0?-out:out), st.face>0?Math.PI:0);
    // monitor on the desk facing the seat
    const mon=makeMonitor(a.tint, here && a.status==="working"); mon.scale.setScalar(Math.max(0.8,sc));
    add(mon, st.x, 0.8, DESK_CZ+(st.face>0?-0.42:0.42), st.face>0?Math.PI:0);
    if(here){
      const o=botObject(a, SEAT_TOP*sc); o.root.scale.setScalar(sc);
      o.root.rotation.y=st.face>0?0:Math.PI;
      if(S.selectedId===a.id) o.root.add(selRing(0.5));
      // returning from a walk: glide back to the chair
      if(a._wx!=null && a._wasWalking){ movers.push({mesh:o.root, fx:a._wx, fz:a._wz, tx:st.x, tz:st.z, t:0}); o.root.position.set(a._wx,0,a._wz); scene.add(o.root); }
      else add(o.root, st.x, 0, st.z);
      a._wasWalking=false;
      bobbers.push({mesh:o.bot, baseY:o.bot.position.y, phase:a.seat*0.7});
    }else if(sp.kind==="couch"){
      const cs=couchSlot(sp.k);
      const o=botObject(a, 0.34); o.root.rotation.y=-Math.PI/2; o.root.scale.setScalar(Math.min(1,sc*1.0));
      if(S.selectedId===a.id) o.root.add(selRing(0.46));
      add(o.root, cs.x, 0, cs.z);
      bobbers.push({mesh:o.bot, baseY:o.bot.position.y, phase:2+sp.k});
    }
  });
  walkersList().forEach(a=>{
    const o=botObject(a, 0.05); o.root.scale.setScalar(Math.min(1,sc*1.05));
    const sh=noShadow(new THREE.Mesh(new THREE.CircleGeometry(0.3,20),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:nightOn()?0.3:0.13,depthWrite:false})));
    sh.rotation.x=-Math.PI/2; sh.position.y=0.012; o.root.add(sh);
    if(S.selectedId===a.id) o.root.add(selRing(0.44));
    const here=posOnPath(walkBaseDist(a)+walkClock);
    add(o.root, here.x, 0, here.z); o.root.rotation.y=Math.atan2(here.dx,here.dz);
    a._wasWalking=true;
    walkers.push({mesh:o.root, bot:o.bot, botBaseY:o.bot.position.y, phase:a.seat*1.3, agent:a});
  });
}
function disposeScene(){
  bobbers=[]; steams=[]; pickables=[]; walkers=[]; movers=[];
  if(!scene) return;
  scene.traverse(c=>{
    if(c.geometry) c.geometry.dispose();
    if(c.material){[].concat(c.material).forEach(m=>{if(m&&m.map&&m.map!==tvTex)m.map.dispose(); if(m)m.dispose();});}
  });
  scene=null;
}
function measureStage(){
  const stage=document.getElementById("stage"); if(!stage) return {w:0,h:0};
  return {w:Math.round(stage.clientWidth||0), h:Math.round(stage.clientHeight||0)};
}
function frustum(a){
  // fit the whole office: wide screens are limited by height, narrow (phone) by width
  return a<0.8 ? Math.max(5.2, 6.0/Math.max(0.3,a)) : Math.max(5.6, 8.3/a);
}
function resizeThree(force){
  if(!renderer||!camera) return false;
  const {w,h}=measureStage(); if(w<16||h<16) return false;
  const dpr=Math.min(window.devicePixelRatio||1,2), key=w+"x"+h+"@"+dpr;
  if(force || key!==lastSize){
    lastSize=key;
    renderer.setPixelRatio(dpr); renderer.setSize(w,h,false);
    const a=w/h, f=frustum(a)*0.82;
    camera.left=-f*a; camera.right=f*a; camera.top=f; camera.bottom=-f;
    applyCam();
  }
  renderNow();
  return true;
}
function renderNow(){
  if(!renderer||!scene||!camera||ctxLost||fallbackMode) return;
  try{ renderer.render(scene,camera); renderErrs=0; }
  catch(err){ renderErrs++; console.warn("render failed",err); if(renderErrs>3) useFallback("render keeps failing"); }
}
let hooked=false;
function hookStageResize(){
  if(hooked) return; hooked=true;
  const stage=document.getElementById("stage");
  const kick=()=>{ if(threeReady&&!fallbackMode) requestAnimationFrame(()=>resizeThree(false)); };
  if(window.ResizeObserver) new ResizeObserver(kick).observe(stage);
  window.addEventListener("resize",kick);
  window.addEventListener("orientationchange",()=>{kick(); setTimeout(kick,300); setTimeout(kick,900);});
  // auth.js hides the page (html.sa-locked) until sign-in finishes; re-measure when it unlocks
  new MutationObserver(kick).observe(document.documentElement,{attributes:true,attributeFilter:["class"]});
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ lastTick=performance.now(); kick(); } });
  window.addEventListener("pageshow",kick);
}
function onContextLost(e){
  e.preventDefault(); ctxLost=true;
  clearTimeout(recoverTimer);
  recoverTimer=setTimeout(()=>rebuildRenderer("context not restored"),2500);
}
function onContextRestored(){ clearTimeout(recoverTimer); rebuildRenderer("context restored"); }
function rebuildRenderer(why){
  recoveries++;
  // GPU objects died with the old context: drop them without dispose() (disposing would touch the wrong context)
  try{ if(renderer){ renderer.domElement.removeEventListener("webglcontextlost",onContextLost); renderer.domElement.removeEventListener("webglcontextrestored",onContextRestored); renderer.domElement.remove(); } }catch(err){}
  renderer=null; threeReady=false; ctxLost=false; lastSize=""; scene=null; tvTex=null;
  bobbers=[]; steams=[]; pickables=[]; walkers=[]; movers=[];
  if(recoveries>4){ useFallback("3D view keeps losing the graphics context ("+why+")"); return; }
  paintScene();
}
function initThree(){
  if(threeReady) return true;
  if(typeof THREE==="undefined"){ useFallback("3D library didn't load"); return false; }
  const stage=document.getElementById("stage"); if(!stage) return false;
  try{
    renderer=new THREE.WebGLRenderer({antialias:true, alpha:false, powerPreference:"default", failIfMajorPerformanceCaveat:false});
  }catch(err){ useFallback("WebGL unavailable"); return false; }
  if(!renderer.getContext || !renderer.getContext()){ useFallback("WebGL unavailable"); return false; }
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  if(THREE.sRGBEncoding) renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.domElement.addEventListener("webglcontextlost",onContextLost,false);
  renderer.domElement.addEventListener("webglcontextrestored",onContextRestored,false);
  renderer.domElement.setAttribute("aria-label","3D office with "+S.agents.length+" bots and "+LAY.seats.length+" chairs");
  stage.replaceChildren(renderer.domElement);
  camera=new THREE.OrthographicCamera(-10,10,8,-8,0.1,80);
  threeReady=true; fallbackMode=false;
  hookStageResize();
  startLoop();
  return true;
}
function startLoop(){
  if(looping) return; looping=true; lastTick=performance.now();
  (function loop(){
    requestAnimationFrame(loop);
    if(fallbackMode||ctxLost||!threeReady||document.hidden) return;
    const now=performance.now(), t=now/1000, dt=Math.min(0.05,(now-(lastTick||now))/1000); lastTick=now;
    walkClock+=dt*1.0;
    bobbers.forEach(b=>{b.mesh.position.y=b.baseY+Math.sin(t*2.1+b.phase)*0.03;});
    walkers.forEach(w=>{
      const here=posOnPath(walkBaseDist(w.agent)+walkClock);
      w.mesh.position.set(here.x,0,here.z);
      if(Math.abs(here.dx)+Math.abs(here.dz)>0.001) w.mesh.rotation.y=Math.atan2(here.dx,here.dz);
      w.bot.position.y=w.botBaseY+Math.abs(Math.sin(t*9+w.phase))*0.05;
      w.agent._wx=here.x; w.agent._wz=here.z;
    });
    movers=movers.filter(m=>{ m.t=Math.min(1,m.t+dt/1.2); const e=m.t*m.t*(3-2*m.t); m.mesh.position.set(m.fx+(m.tx-m.fx)*e,0,m.fz+(m.tz-m.fz)*e); return m.t<1; });
    steams.forEach(s=>{const ph=(t*0.5+s.userData.i*0.17)%1; s.position.y=s.userData.y0+0.85+ph*0.55; s.position.x=-0.4+Math.sin(t*2+s.userData.i)*0.03; s.material.opacity=0.45*(1-ph);});
    renderNow();
  })();
}
function applyCam(){
  if(!camera) return;
  const target=new THREE.Vector3(-CAM.x/90+0.5, 0.4, -CAM.y/90-0.1);
  const yaw=0.82+CAM.rot*Math.PI/180, pitch=0.6, dist=20;
  camera.position.set(target.x+Math.cos(yaw)*Math.cos(pitch)*dist, target.y+Math.sin(pitch)*dist, target.z+Math.sin(yaw)*Math.cos(pitch)*dist);
  camera.lookAt(target); camera.zoom=CAM.z; camera.updateProjectionMatrix();
}
function paintScene(){
  applyTheme();
  if(fallbackMode){ paintFallback(); return; }
  if(!initThree()) return;
  try{
    disposeScene();
    scene=new THREE.Scene();
    renderer.setClearColor(hexCol(pal().bg),1);
    buildRoom(); addOffice();
    resizeThree(true);
  }catch(err){ console.warn(err); useFallback(err&&err.message||String(err)); }
}

function useFallback(reason){

  const g=t.dataset.tog;
  if(g==="fin"){S.openFinished=!S.openFinished;paintChrome();return}
  if(g==="rtn"){S.openRoutines=!S.openRoutines;paintChrome();return}
  if(g==="left"){S.leftOpen=!S.leftOpen;paintChrome();return}
  if(g==="right"){S.rightOpen=!S.rightOpen;paintChrome();return}
  if(g==="retry3d"){fallbackMode=false;recoveries=0;paintScene();}
});
function pickBot(ev){
  if(!camera||!renderer||fallbackMode) return null;
  const rec=renderer.domElement.getBoundingClientRect();
  const m=new THREE.Vector2(((ev.clientX-rec.left)/rec.width)*2-1, -((ev.clientY-rec.top)/rec.height)*2+1);
  const ray=new THREE.Raycaster(); ray.setFromCamera(m,camera);
  const hits=ray.intersectObjects(pickables,true); if(!hits.length) return null;
  let o=hits[0].object; while(o&&!o.userData.agentId) o=o.parent; return o&&o.userData.agentId;
}
(function bindCam(){
  const stage=document.getElementById("stage"); let drag=null;
  stage.addEventListener("contextmenu",e=>e.preventDefault());
  stage.addEventListener("pointerdown",e=>{ if(fallbackMode) return; drag={x:e.clientX,y:e.clientY,cx:CAM.x,cy:CAM.y,cr:CAM.rot,btn:e.button,moved:0}; try{stage.setPointerCapture(e.pointerId)}catch(err){} });
  stage.addEventListener("pointermove",e=>{
    if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.moved=Math.max(drag.moved,Math.hypot(dx,dy)); if(drag.moved<4) return;
    if(drag.btn===2||drag.btn===1){CAM.x=drag.cx+dx;CAM.y=drag.cy+dy} else {CAM.rot=Math.max(-38,Math.min(38,drag.cr+dx*0.18)); CAM.y=Math.max(-260,Math.min(260,drag.cy+dy*0.4))}
    applyCam(); renderNow();
  });
  stage.addEventListener("pointerup",e=>{ if(drag&&drag.moved<6){const id=pickBot(e); if(id) viewAgent(id);} drag=null; });
  stage.addEventListener("pointercancel",()=>{drag=null});
  stage.addEventListener("wheel",e=>{ if(fallbackMode) return; e.preventDefault(); CAM.z=Math.min(2.2,Math.max(0.7,CAM.z*(e.deltaY>0?0.92:1.09))); applyCam(); renderNow(); },{passive:false});
  window.addEventListener("keydown",e=>{
    if(["INPUT","TEXTAREA"].includes((e.target||{}).tagName)) return; const step=36;
    if(e.key==="w"||e.key==="ArrowUp")CAM.y+=step; else if(e.key==="s"||e.key==="ArrowDown")CAM.y-=step;
    else if(e.key==="a"||e.key==="ArrowLeft")CAM.x+=step; else if(e.key==="d"||e.key==="ArrowRight")CAM.x-=step;
    else if(e.key==="0"||e.key==="r"||e.key==="R"){CAM.x=0;CAM.y=0;CAM.z=1;CAM.rot=0} else return;
    applyCam(); renderNow();
  });
})();
/* live team book from the same accounts.js the Profits page uses (works only after sign-in; harmless if it fails) */
function loadBook(){
  if(typeof window.accountsHTML!=="function") return;
  Promise.race([window.accountsHTML(), new Promise(r=>setTimeout(r,20000))]).then(()=>{
    const A=(window.__ACC||[]).filter(a=>a&&a.eq!=null&&a.start!=null); if(!A.length) return;
    const name=n=>/SOLANA/.test(n)?"Fast Crypto":/MAJOR/.test(n)?"MAJOR":/stock/i.test(n)?"Fake Stocks":n;
    S.book={eq:A.reduce((s,a)=>s+(+a.eq),0), start:A.reduce((s,a)=>s+(+a.start),0), lanes:A.map(a=>({n:name(a.n),eq:+a.eq,start:+a.start}))};
    drawTV(); paintChrome();
  }).catch(err=>console.info("team book not loaded:",err&&err.message||err));
}
(function(){const sc=document.createElement("script"); sc.src="accounts.js?v="+VER; sc.onload=loadBook; sc.onerror=()=>{}; document.body.appendChild(sc);})();
setInterval(loadBook,5*60000);
setInterval(()=>{const n=Date.now();S.nowMs=n;S.clock=fmtCT(new Date(n));const el=document.getElementById("clock");if(el)el.textContent=S.clock;},30000);
/* idle helpers wander and come back to their own chair */
setInterval(()=>{
  if(document.hidden) return;
  const work=S.agents.filter(a=>a.wander&&a.status==="working"), wand=S.agents.filter(a=>a.wander&&isIdle(a.status));
  let changed=false;
  if(wand.length&&Math.random()<0.5){const a=wand[Math.floor(Math.random()*wand.length)];a.status="working";a.task=a.task.replace(/^Back at the desk · /,"");a.task="Back at the desk · "+a.task;changed=true;}
  else if(work.length&&Math.random()<0.5){const a=work[Math.floor(Math.random()*work.length)];a.status="idle";a.task=a.task.replace(/^Back at the desk · /,"");changed=true;}
  if(changed) paint();
},20000);
window.__office={S,layout:()=>LAY,state:()=>({threeReady,fallbackMode,ctxLost,recoveries,seats:LAY.seats.length,bots:S.agents.length,pickables:pickables.length,walkers:walkers.length}),renderer:()=>renderer};
paint();
})();
