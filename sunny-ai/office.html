  return new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",hour:"numeric",minute:"2-digit"}).format(d)+" CT";
}
function relTime(at,now){
  const sec=Math.max(0,Math.floor((now-at)/1000));
  if(sec<45)return "just now";
  if(sec<3600)return Math.floor(sec/60)+"m ago";
  if(sec<86400)return Math.floor(sec/3600)+"h ago";
  return Math.floor(sec/86400)+"d ago";
}
function iso(x,y,z,ox,oy){return {x:(x-y)*TILE+ox,y:(x+y)*RISE-z*RISE+oy}}
function pts(list){return list.map(p=>p.x+","+p.y).join(" ")}
function statusColor(s){return s==="working"?"#22e08a":s==="waiting"?"#ffb020":s==="error"?"#ff4d5e":"#94a3b8"}
function mixHex(hex,other,t){
  const parse=h=>{h=String(h).replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
  const a=parse(hex),b=parse(other);
  return "#"+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,"0")).join("");
}
function faces(fill){
  return {
    top:mixHex(fill,"#ffffff",0.38),
    left:mixHex(fill,"#000000",0.14),
    right:mixHex(fill,"#000000",0.34),
    deep:mixHex(fill,"#000000",0.48),
    edge:mixHex(fill,"#1a120c",0.42),

  };
}
function isoBox(x,y,z,w,d,h,ox,oy,top,left,right,stroke){
  const t1=iso(x,y,z+h,ox,oy),t2=iso(x+w,y,z+h,ox,oy),t3=iso(x+w,y+d,z+h,ox,oy),t4=iso(x,y+d,z+h,ox,oy);
  const l1=iso(x,y,z,ox,oy),l2=iso(x,y+d,z,ox,oy),r1=iso(x+w,y+d,z,ox,oy);
  return `<g>
    <polygon points="${pts([t1,t2,t3,t4])}" fill="${top}" stroke="${stroke}" stroke-width="0.7" stroke-linejoin="round"/>
    <polygon points="${pts([t1,t4,l2,l1])}" fill="${left}" stroke="${stroke}" stroke-width="0.7" stroke-linejoin="round"/>
    <polygon points="${pts([t4,t3,r1,l2])}" fill="${right}" stroke="${stroke}" stroke-width="0.7" stroke-linejoin="round"/>

}
function isoPyramid(x,y,z,w,d,h,ox,oy,fill){

  const apex=iso(x+w/2,y+d/2,z+h,ox,oy);
  const nw=iso(x,y,z,ox,oy), ne=iso(x+w,y,z,ox,oy);
  const se=iso(x+w,y+d,z,ox,oy), sw=iso(x,y+d,z,ox,oy);
  return `<g>
    <polygon points="${pts([apex,nw,sw])}" fill="${f.left}" stroke="${f.edge}" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="${pts([apex,sw,se])}" fill="${f.right}" stroke="${f.edge}" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="${pts([apex,ne,nw])}" fill="${f.top}" stroke="${f.edge}" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="${apex.x},${apex.y} ${apex.x-6},${apex.y+8} ${apex.x+10},${apex.y+6}" fill="#fff" opacity="0.28"/>
  </g>`;
}
function isoSphere(cx,cy,r,fill){

function isoCapsule(cx,yTop,yBot,rx,ry,fill){

function isoDiamond(cx,cy,r,fill){
  const f=faces(fill);
  const top={x:cx,y:cy-r*1.18}, bot={x:cx,y:cy+r*1.14};
  const L={x:cx-r*0.96,y:cy+r*0.08}, R={x:cx+r*0.96,y:cy+r*0.08};
  const fm={x:cx+r*0.04,y:cy+r*0.3};
  return `<g>
    <polygon points="${top.x},${top.y} ${L.x},${L.y} ${fm.x},${fm.y}" fill="${f.left}" stroke="${f.edge}" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="${top.x},${top.y} ${fm.x},${fm.y} ${R.x},${R.y}" fill="${f.top}" stroke="${f.edge}" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="${L.x},${L.y} ${bot.x},${bot.y} ${fm.x},${fm.y}" fill="${f.right}" stroke="${f.edge}" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="${fm.x},${fm.y} ${bot.x},${bot.y} ${R.x},${R.y}" fill="${f.deep}" stroke="${f.edge}" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="${top.x},${top.y} ${cx-r*0.2},${cy-r*0.18} ${cx+r*0.26},${cy-r*0.1}" fill="#fff" opacity="0.32"/>
  </g>`;
}
function isoStar(cx,cy,r,fill){
  const f=faces(fill);
  const dx=7, dy=6, front=[], back=[];
  for(let i=0;i<10;i++){
    const rad=i%2===0?r:r*0.4;
    const a=-Math.PI/2+(i*Math.PI)/5;
    const x=cx+Math.cos(a)*rad, y=cy+Math.sin(a)*rad;
    front.push({x,y}); back.push({x:x+dx,y:y+dy});
  }
  let html="<g>";
  for(let i=0;i<10;i++){
    const a=front[i], b=front[(i+1)%10], c=back[(i+1)%10], d=back[i];
    html+=`<polygon points="${a.x},${a.y} ${b.x},${b.y} ${c.x},${c.y} ${d.x},${d.y}" fill="${i%2?f.right:f.left}" stroke="${f.edge}" stroke-width="0.3"/>`;
  }
  html+=`<polygon points="${back.map(p=>p.x+","+p.y).join(" ")}" fill="${f.deep}"/>`;
  html+=`<polygon points="${front.map(p=>p.x+","+p.y).join(" ")}" fill="${f.mid}" stroke="${f.edge}" stroke-width="0.85" stroke-linejoin="round"/>`;
  html+=`<ellipse cx="${cx-r*0.12}" cy="${cy-r*0.2}" rx="${r*0.22}" ry="${r*0.12}" fill="#fff" opacity="0.32"/>`;
  return html+"</g>";
}

}

function clayMat(color, extra){
  extra = extra||{};
  const base={color: color, roughness: extra.roughness!=null?extra.roughness:0.48, metalness: extra.metalness!=null?extra.metalness:0.04};
  if(extra.clearcoat && THREE.MeshPhysicalMaterial){
    return new THREE.MeshPhysicalMaterial(Object.assign(base,{
      clearcoat: extra.clearcoat, clearcoatRoughness: extra.clearcoatRoughness||0.4
    }, extra));
  }
  return new THREE.MeshStandardMaterial(Object.assign(base, extra));
}

function starGeo(){
  const sh=new THREE.Shape();
  for(let i=0;i<10;i++){
    const r=i%2===0?0.48:0.2;
    const a=-Math.PI/2+i*Math.PI/5;
    const x=Math.cos(a)*r, y=Math.sin(a)*r;
    i?sh.lineTo(x,y):sh.moveTo(x,y);
  }
  sh.closePath();
  const g=new THREE.ExtrudeGeometry(sh,{depth:0.2,bevelEnabled:true,bevelThickness:0.05,bevelSize:0.035,bevelSegments:2});
  g.center();
  return g;
}
function enableShadow(obj){
  obj.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; }});
}
function makeBotMesh(shape, tint){
  const mat=clayMat(tint);

    mesh=new THREE.Mesh(new THREE.SphereGeometry(0.46, 36, 26), clayMat(tint,{roughness:0.34, metalness:0.08, clearcoat:0.55, clearcoatRoughness:0.32}));
    mesh.scale.y=0.9;
  }else if(shape==="cube"){
    mesh=new THREE.Mesh(new THREE.BoxGeometry(0.74, 0.74, 0.74), mat);
  }else if(shape==="cylinder"){
    const g=new THREE.Group();
    const r=0.29, h=0.62;
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,28), mat));
    const capT=new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), mat);
    const capB=new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), mat);
    capT.position.y=h/2; capB.position.y=-h/2;
    g.add(capT, capB);
    mesh=g;
  }else if(shape==="pyramid"){
    mesh=new THREE.Mesh(new THREE.ConeGeometry(0.48, 0.92, 4), mat);
  }else if(shape==="diamond"){
    mesh=new THREE.Mesh(new THREE.OctahedronGeometry(0.48), mat);
  }else{
    mesh=new THREE.Mesh(starGeo(), mat);
  }
  enableShadow(mesh);
  return mesh;
}
function bubbleSprite(agent, selected){
  const c=document.createElement("canvas");
  c.width=256; c.height=128;
  const ctx=c.getContext("2d");
  ctx.clearRect(0,0,256,128);
  const drawRound=(x,y,w,h,r,fill,sh)=>{
    ctx.save();
    if(sh){ ctx.shadowColor="rgba(0,0,0,.22)"; ctx.shadowBlur=10; ctx.shadowOffsetY=3; }
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
    ctx.fillStyle=fill; ctx.fill();
    ctx.restore();
  };
  if(agent.bubble){
    drawRound(18,36,220,56,18,"#fff",true);
    ctx.fillStyle="#111827"; ctx.font="600 18px system-ui,sans-serif"; ctx.textAlign="center";
    const t=agent.bubble.length>22?agent.bubble.slice(0,20)+"…":agent.bubble;
    ctx.fillText(t,128,72);
  }else if(agent.status==="waiting"){
    ctx.beginPath(); ctx.arc(128,64,34,0,Math.PI*2); ctx.fillStyle="#ffb020";
    ctx.shadowColor="rgba(0,0,0,.2)"; ctx.shadowBlur=8; ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle="#111"; ctx.font="800 40px system-ui"; ctx.textAlign="center"; ctx.fillText("!",128,78);
  }else if(selected){
    ctx.beginPath(); ctx.arc(128,64,34,0,Math.PI*2); ctx.fillStyle="#3b82f6";
    ctx.shadowColor="rgba(0,0,0,.2)"; ctx.shadowBlur=8; ctx.fill();
    ctx.shadowBlur=0; ctx.strokeStyle="#fff"; ctx.lineWidth=8; ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.beginPath(); ctx.moveTo(112,66); ctx.lineTo(124,78); ctx.lineTo(150,50); ctx.stroke();
  }else if(agent.status==="working"){
    drawRound(58,40,140,52,26,"#22c55e",true);
    ctx.fillStyle="#fff";
    [[100,66],[128,66],[156,66]].forEach(([x,y])=>{ ctx.beginPath(); ctx.arc(x,y,8,0,Math.PI*2); ctx.fill(); });
  }else if(agent.status==="resting"){
    ctx.fillStyle="#64748b"; ctx.font="700 36px system-ui"; ctx.textAlign="center";
    ctx.fillText("z z", 148, 58);
  }else if(agent.status==="error"){
    ctx.beginPath(); ctx.arc(128,64,34,0,Math.PI*2); ctx.fillStyle="#ff4d5e"; ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="800 40px system-ui"; ctx.textAlign="center"; ctx.fillText("!",128,78);
  }
  const tex=new THREE.CanvasTexture(c);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  spr.scale.set(1.05, 0.52, 1);
  spr.position.y=1.42;
  spr.center.set(0.5, 0.15);
  return spr;
}

function makeClock(){
  const g=new THREE.Group();
  const face=new THREE.Mesh(new THREE.CircleGeometry(0.32, 32), clayMat(nightOn()?"#e8edf4":"#f8fafc"));
  const ring=new THREE.Mesh(new THREE.RingGeometry(0.3,0.34,32), clayMat("#111827"));
  face.position.z=0.01; g.add(ring, face);
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",hour:"numeric",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const hh=+(parts.find(p=>p.type==="hour")||{}).value||0;
  const mm=+(parts.find(p=>p.type==="minute")||{}).value||0;
  const hour=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.16,0.02), clayMat("#111827"));
  hour.position.y=0.07; hour.rotation.z=-((hh%12)+mm/60)*Math.PI/6;
  const minute=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.22,0.02), clayMat("#111827"));
  minute.position.y=0.1; minute.rotation.z=-(mm)*Math.PI/30;
  g.add(hour, minute);

}
function drawTV(){

function seatX(col){ return -3.15 + col*1.58; }

function place3(agent){
  const mates=S.agents.filter(a=>a.floor===agent.floor);
  const onlyOneRow=mates.every(a=>a.row===mates[0].row);
  const row=onlyOneRow?1:(agent.row===0?1:0);
  const face=row===0?1:-1;
  return {x:seatX(agent.col), z:seatZ(face), face};
}

function disposeScene(){
  bobbers=[]; steams=[]; pickables=[];
  if(!scene) return;
  while(scene.children.length){
    const obj=scene.children[0];
    scene.remove(obj);
    obj.traverse(c=>{
      if(c.geometry) c.geometry.dispose();
      if(c.material){
        const arr=[].concat(c.material);
        arr.forEach(m=>{ if(m&&m.map&&m.map!==tvTex) m.map.dispose(); if(m) m.dispose(); });
      }
    });
  }
}

function resizeThree(){
  if(!renderer||!camera)return;
  const stage=document.getElementById("stage");
  const r=stage.getBoundingClientRect();
  const w=Math.max(2, r.width), h=Math.max(2, r.height);
  renderer.setSize(w, h, false);
  const a=w/h, f=4.72;
  camera.left=-f*a; camera.right=f*a; camera.top=f; camera.bottom=-f;
  camera.updateProjectionMatrix();
  applyCam();
}
function initThree(){
  if(threeReady) return;
  if(typeof THREE==="undefined"){ console.warn("THREE missing"); return; }
  const stage=document.getElementById("stage");
  renderer=new THREE.WebGLRenderer({antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  if(THREE.sRGBEncoding) renderer.outputEncoding=THREE.sRGBEncoding;
  stage.innerHTML="";
  stage.appendChild(renderer.domElement);
  scene=new THREE.Scene();
  camera=new THREE.OrthographicCamera(-10,10,8,-8,0.1,80);
  threeReady=true;
  resizeThree();
  window.addEventListener("resize", resizeThree);
  if(!looping){ looping=true; (function loop(){
    requestAnimationFrame(loop);
    const t=performance.now()/1000;
    bobbers.forEach(b=>{ if(b.mesh) b.mesh.position.y=b.baseY+Math.sin(t*2.15+b.phase)*0.032; });
    steams.forEach((s,i)=>{
      const ph=(t*0.4+i*0.18)%0.5;
      s.position.y=(s.userData.y0||1.1)+ph;
      if(s.material) s.material.opacity=0.42*(1-ph/0.5);
    });
    if(renderer&&scene&&camera) renderer.render(scene, camera);
  })(); }
}
function applyCam(){
  if(!camera) return;
  const target=new THREE.Vector3(-CAM.x/90, 0.4, -CAM.y/90);
  const yaw=0.82 + CAM.rot*Math.PI/180;
  const pitch=0.58;
  const dist=17;
  camera.position.set(
    target.x + Math.cos(yaw)*Math.cos(pitch)*dist,
    target.y + Math.sin(pitch)*dist,
    target.z + Math.sin(yaw)*Math.cos(pitch)*dist
  );
  camera.lookAt(target);
  camera.zoom=CAM.z;
  camera.updateProjectionMatrix();
}
function paintScene(){
  applyTheme();
  initThree();
  if(!threeReady) return;
  disposeScene();
  scene=new THREE.Scene();
  buildRoom(S.floor);
  if(S.floor===5) addMeetingFloor();
  else addWorkFloor(S.floor);
  applyCam();
}
function pickBot(ev){
  if(!camera||!renderer) return null;
  const rec=renderer.domElement.getBoundingClientRect();
  const m=new THREE.Vector2(((ev.clientX-rec.left)/rec.width)*2-1, -((ev.clientY-rec.top)/rec.height)*2+1);
  const ray=new THREE.Raycaster();
  ray.setFromCamera(m, camera);
  const hits=ray.intersectObjects(pickables, true);
  if(!hits.length) return null;
  let o=hits[0].object;
  while(o && !o.userData.agentId) o=o.parent;
  return o&&o.userData.agentId;
}

  if(t.dataset.mode){
    S.mode=t.dataset.mode;
    if(S.mode==="day"||S.mode==="night") S.theme=S.mode;
    persist(); setTour(); paint();
    return;
  }
  if(t.dataset.floor){S.floor=+t.dataset.floor; persist(); paint(); animateShift(); return}
  if(t.dataset.view){viewAgent(t.dataset.view); animateShift(); return}
  if(t.dataset.ok){approve(t.dataset.ok); return}
  if(t.dataset.pick){S.selectedId=t.dataset.pick;const who=S.agents.find(a=>a.id===t.dataset.pick);if(who)S.floor=who.floor;paint();animateShift();return}
  if(t.dataset.tog==="fin"){S.openFinished=!S.openFinished;paintChrome();return}
  if(t.dataset.tog==="rtn"){S.openRoutines=!S.openRoutines;paintChrome();return}
  if(t.dataset.tog==="left"){S.leftOpen=!S.leftOpen;paintChrome();return}
  if(t.dataset.tog==="right"){S.rightOpen=!S.rightOpen;paintChrome()}
});
function setTour(){
  clearInterval(tourId);
  if(S.mode!=="tour")return;
  tourId=setInterval(()=>{
    const order=[5,4,3,2,1];
    const i=order.indexOf(S.floor);
    S.floor=order[(i<0?0:i+1)%order.length];
    paint(); animateShift();
  },4200);
}
(function bindCam(){
  const stage=document.getElementById("stage");
  let drag=null;
  stage.addEventListener("contextmenu",e=>e.preventDefault());
  stage.addEventListener("pointerdown",e=>{
    drag={x:e.clientX,y:e.clientY,cx:CAM.x,cy:CAM.y,cr:CAM.rot,btn:e.button,moved:0};
    try{stage.setPointerCapture(e.pointerId)}catch(err){}
  });
  stage.addEventListener("pointermove",e=>{
    if(!drag)return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    drag.moved=Math.max(drag.moved, Math.hypot(dx,dy));
    if(drag.moved<4)return;
    if(drag.btn===2 || drag.btn===1){CAM.x=drag.cx+dx;CAM.y=drag.cy+dy}
    else {CAM.rot=Math.max(-38,Math.min(38,drag.cr+dx*0.18)); CAM.y=drag.cy+dy*0.4}
    applyCam();
  });
  const end=e=>{
    if(drag && drag.moved<6){
      const id=pickBot(e);
      if(id){ S.selectedId=id; const who=S.agents.find(a=>a.id===id); if(who) S.floor=who.floor; paint(); }
    }
    drag=null;
  };
  stage.addEventListener("pointerup",end);
  stage.addEventListener("pointercancel",()=>{drag=null});
  stage.addEventListener("wheel",e=>{
    e.preventDefault();
    CAM.z=Math.min(1.85,Math.max(0.6,CAM.z*(e.deltaY>0?0.92:1.09)));
    applyCam();
  },{passive:false});
  window.addEventListener("keydown",e=>{
    if(["INPUT","TEXTAREA"].includes((e.target||{}).tagName))return;
    const step=36;
    if(e.key==="w"||e.key==="W"||e.key==="ArrowUp"){CAM.y+=step;applyCam()}
    else if(e.key==="s"||e.key==="S"||e.key==="ArrowDown"){CAM.y-=step;applyCam()}
    else if(e.key==="a"||e.key==="A"||e.key==="ArrowLeft"){CAM.x+=step;applyCam()}
    else if(e.key==="d"||e.key==="D"||e.key==="ArrowRight"){CAM.x-=step;applyCam()}
    else if(e.key==="0"||e.key==="r"||e.key==="R"){CAM.x=0;CAM.y=0;CAM.z=1;CAM.rot=0;applyCam()}
    else if(e.key>="1"&&e.key<="5"){S.floor=+e.key;paint();animateShift()}
  });
})();
setInterval(()=>{const n=Date.now();S.nowMs=n;S.clock=fmtCT(new Date(n));const el=document.getElementById("clock");if(el)el.textContent=S.clock;},30000);
setInterval(()=>{
  const n=Date.now();
  S.equity=2840+Math.round((n/7000)%16);
  S.scans=14+Math.round((n/4000)%19);
  if(typeof drawTV==="function") drawTV();
},2200);
setInterval(()=>{const line=AMBIENCE[amb%AMBIENCE.length];amb++;S.feed=[{id:"live-"+Date.now(),text:line,at:Date.now()},...S.feed].slice(0,16);paintChrome()},16000);
paint();
setTour();
animateShift();
})();
