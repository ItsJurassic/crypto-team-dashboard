<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunny AI · Profits</title>
<style>
:root{--bg:#07090d;--card:#0f131a;--line:#1c222c;--mut:#7b8594;--g:#22e08a;--r:#ff4d5e;--t:#e7ecf3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.wrap{max-width:1000px;margin:auto;padding:16px}.banner{background:#2a1a00;color:#ffb020;border:2px solid #7a4a00;border-radius:10px;padding:10px;text-align:center;font-weight:800;font-size:14px;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}.hd{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
a.back{color:var(--mut);text-decoration:none;display:inline-block;margin-top:12px}.g{color:var(--g)}.r{color:var(--r)}.m{color:var(--mut)}
.big{font-size:42px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.met{background:#0b0e14;border:1px solid var(--line);border-radius:10px;padding:10px}.met b{display:block;font-size:18px}.met span{color:var(--mut);font-size:11px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}td,th{padding:6px 5px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:500}
.tag{font-size:9px;padding:1px 4px;border-radius:4px;background:#1c2533;color:#8fb3ff}p{margin:0}
</style></head><body><div class="wrap">
<div class="banner">⚠ PAPER / SIMULATED ONLY — NOT REAL MONEY. Most trades use synthetic SIM-FEED tokens.</div>
<a class="back" href="./">← Back to Sunny AI desk</a>
<div class="card"><div class="hd">Total paper P/L</div><div class="big" id="tot">—</div><div class="m" id="sub"></div></div>
<div class="card"><div class="hd">Breakdown</div><div class="grid" id="mets"></div></div>
<div class="card"><div class="hd">By lane</div><div class="grid" id="lanes"></div></div>
<div class="card"><div class="hd">How it happened (plain English)</div><p id="expl"></p></div>
<div class="card"><div class="hd">Contributing trades (best → worst)</div><div class="tw"><table id="rows"></table></div></div>
<p class="m" style="font-size:11px;text-align:center;margin-top:12px" id="upd"></p></div>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s??"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])),
m=n=>(n<0?"-$":"$")+Math.abs(+n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),sg=n=>(n>=0?"+":"")+m(n),c=n=>n>=0?"g":"r",
pr=n=>n==null?"—":Number(n).toPrecision(4),tm=t=>t?new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):"—";
async function go(){try{const d=await (await fetch("data/profits.json?"+Date.now())).json();
$("tot").innerHTML=`<span class=${c(d.total_pnl)}>${sg(d.total_pnl)}</span> <span class=m style="font-size:18px">(${((d.equity/d.start-1)*100).toFixed(2)}%)</span>`;
$("sub").textContent=`Equity ${m(d.equity)} vs ${m(d.start)} start`;
const S=d.by_source||{};$("mets").innerHTML=[["Realized (closed)",d.realized,1],["Unrealized (open)",d.unrealized,1],["SOLANA · SIM-FEED",S["SIM-FEED"]||0,1],["SOLANA · REAL tokens",S["REAL-DATA"]||0,1],["MAJOR lane",S["MAJOR"]||0,1],["Fees paid",-d.fees_total,1],["Slippage cost",-d.slippage_cost,1],["Closed trades",`${d.closed} (${d.wins}W / ${d.losses}L)`],["Failed fills",d.failed_fills]].map(([l,v,n])=>`<div class=met><b class="${n?c(v):""}">${n?sg(v):esc(v)}</b><span>${l}</span></div>`).join("");
const BL=d.by_lane||{};$("lanes").innerHTML=Object.entries(BL).map(([n,v])=>`<div class=met><b class=${c(v.pnl)}>${sg(v.pnl)}</b><span>${n} lane · realized ${sg(v.realized)} · open ${sg(v.unrealized)} · ${v.closed} closed (${v.wins}W) · ${v.open} open${n=="SOLANA"?` · SIM ${sg(S["SIM-FEED"]||0)} / REAL ${sg(S["REAL-DATA"]||0)}`:""}</span></div>`).join("");$("expl").textContent=d.explanation;
$("rows").innerHTML="<tr><th>Token</th><th>Status</th><th>Venue</th><th>Entry</th><th>Exit/Last</th><th>In</th><th>Out</th><th>Size</th><th>Slip $</th><th>Fees</th><th>P/L</th><th>%</th><th>Exit reason</th></tr>"+d.rows.map(r=>`<tr><td>$${esc(r.symbol)} ${r.lane=="MAJOR"?"<span class=tag style=\"background:#2a1f05;color:#ffcf5c\">MAJOR</span>":"<span class=tag style=\"background:#0c2a1c;color:#22e08a\">SOLANA</span> <span class=tag>"+(r.source=="SIM-FEED"?"SIM":"REAL")+"</span>"}</td><td>${r.status}</td><td class=m>${esc(r.venue)}</td><td>${pr(r.entry)}</td><td>${pr(r.exit)}</td><td class=m>${tm(r.entry_time)}</td><td class=m>${tm(r.exit_time)}</td><td>${m(r.size_usd)}</td><td>${r.slip_cost==null?"—":m(r.slip_cost)}</td><td>${m(r.fees)}</td><td class=${c(r.pnl)}>${sg(r.pnl)}</td><td class=${c(r.pnl)}>${r.pnl_pct.toFixed(1)}%</td><td class=m>${esc(r.exit_reason)}</td></tr>`).join("");
$("upd").textContent="PAPER / SIMULATED ONLY · updated "+tm(d.updated)+" · auto-refresh 30s";}catch(e){$("upd").textContent="load error"}}
go();setInterval(go,30000);
</script></body></html>
