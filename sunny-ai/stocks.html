<!doctype html><html><head><script src="auth.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="sunny.css"><title>Sunny AI · Stocks (paper)</title><style>.hd{display:flex;justify-content:space-between;gap:8px}td,th{white-space:nowrap}</style></head><body><div class="wrap">
<div class="banner">PAPER / SIMULATED ONLY · $1,000 PAPER START · NO REAL MONEY · NO REAL ORDERS</div>
<div class="card"><div class="hd"><span>📈 Stocks paper desk</span><span id="upd" class=m></span></div><div id="sum">Loading…</div>
<p class=m style="font-size:11px;margin-top:8px" id="rules"></p></div>
<div class="card"><div class="hd"><span>🧪 Backtest (not a promise)</span></div><div id="bt"></div></div>
<div class="card"><div class="hd"><span>Open positions</span></div><div id="pos" style="overflow-x:auto"></div></div>
<div class="card"><div class="hd"><span>🔎 Latest scan</span><span id="sct" class=m></span></div><div id="scan" style="overflow-x:auto"></div></div>
<div class="card"><div class="hd"><span>🧾 Trades · why</span></div><div id="tr" style="overflow-x:auto"></div></div>
<div class="card"><div class="hd"><span>⛔ Kills (rejected setups)</span></div><div id="kl" style="overflow-x:auto"></div></div>
</div><script>
const $$=n=>n==null||n===""?"—":(n<0?"-$":"$")+Math.abs(+n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),E=id=>document.getElementById(id);
const met=(l,v,c)=>`<div class=met><b style="display:block" class="${c||""}">${v}</b><span class=m style="font-size:11px">${l}</span></div>`;
async function go(){try{const d=await (await fetch("data/stocks.json?"+Date.now())).json();
E("upd").textContent="updated "+new Date(d.updated).toLocaleTimeString()+" CT";
E("sum").innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px">${met("Paper start",$$(d.start))}${met("Equity",$$(d.equity))}${met("Net P/L",$$(d.net_pnl),d.net_pnl>=0?"g":"r")}${met("Cash",$$(d.cash))}${met("Fees / slippage",$$(d.fees)+" / "+$$(d.slippage))}${met("Banked (20%)",$$(d.banked),"g")}${met("Closed · wins",d.closed+" · "+d.wins)}</div>`;
const R=d.rules;E("rules").innerHTML=`<b>Risk rules</b> · ${R.risk_per_trade} risk per trade · max position ${R.max_position} · max ${R.max_positions} positions · max open risk ${R.max_open_risk} · min ${R.min_reward_risk}<br><b>Stops</b> · ${R.stops}<br><b>Exits</b> · ${R.exits}<br><b>Guards</b> · ${R.guards}<br><b>Earnings</b> · ${R.earnings}<br>Fills at the ${R.fills}, slippage ${R.slippage}, commission ${R.commission}, ${R.fractional}. Strategies: TREND (SMA50/200 uptrend + 20-day closing-high breakout on volume) and MEANREV (RSI(2) dip in an uptrend). Weekdays 8:30–15:00 CT every 5 min, daily scan after the close. Data: ${esc(d.data_source)}. Plain rules, no AI. Open risk now ${$$(d.open_risk)} · loss streak ${d.loss_streak}.`;
const bt=d.backtest;E("bt").innerHTML=bt?`<p class=m style="font-size:12px"><span class="pill pf">BACKTEST</span> ${esc(bt.label)} · ${esc(bt.period)}</p><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px">${met("Trades",bt.trades)}${met("Win rate",bt.win_rate+"%")}${met("Avg win",$$(bt.avg_win)+" ("+bt.avg_win_R+"R)","g")}${met("Avg loss",$$(bt.avg_loss)+" ("+bt.avg_loss_R+"R)","r")}${met("Expectancy / trade",$$(bt.expectancy_usd)+" ("+bt.expectancy_R+"R)",bt.expectancy_usd>=0?"g":"r")}${met("Max drawdown","−"+bt.max_drawdown_pct+"%","r")}${met("Worst trade",$$(bt.worst_trade),"r")}${met("Backtest return",bt.return_pct+"%")}</div><p class=m style="font-size:11px;margin-top:6px">Caveats: ${esc(bt.caveats)}</p>`:"";
const P=Object.values(d.positions||{});E("pos").innerHTML=P.length?`<table><tr><th>Symbol</th><th>Strategy</th><th>Qty</th><th>Entry</th><th>Last</th><th>P/L</th><th>Stop</th><th>Target</th></tr>${P.map(p=>{const pl=p.qty*(p.last-p.entry);return`<tr class="rb lb-b"><td><span class="pill pk">OPEN·BUY</span> <b>${p.symbol}</b></td><td>${p.strategy}</td><td>${p.qty}</td><td>${$$(p.entry)}</td><td>${$$(p.last)}</td><td class=${pl>=0?"g":"r"}>${$$(pl)}</td><td>${$$(p.stop)}</td><td>${$$(p.target)}</td></tr><tr><td colspan=8><details class=why><summary>Why we bought</summary>${esc(p.why&&p.why.summary)}<br><span class=m>Checks: ${esc((p.why&&p.why.judge.yes||[]).join(" · "))}</span></details></td></tr>`}).join("")}</table>`:`<p class=m>No open positions.${(d.pending||[]).length?" Queued for next session: "+d.pending.map(p=>p.symbol).join(", "):""}</p>`;
const S=d.scan||{};E("sct").textContent=S.time?new Date(S.time).toLocaleString()+" CT · "+S.data_ok+"/"+S.universe+" symbols":"";
E("scan").innerHTML=(S.note?`<p class=m style="font-size:12px">${esc(S.note)}</p>`:"")+`<table><tr><th>Symbol</th><th>Setup</th><th>Score</th><th>Close</th><th>Stop</th><th>Target 2R</th><th>RSI2/14</th></tr>${(S.top||[]).map(c=>`<tr><td><b>${c.symbol}</b></td><td><span class="pill ${c.strategy=="TREND"?"pb":"pk"}">${c.strategy}</span></td><td>${c.score}</td><td>${$$(c.close)}</td><td>${$$(c.stop)} <span class=m>−${c.risk_pct}%</span></td><td>${$$(c.target)}</td><td>${c.rsi2}/${c.rsi14}</td></tr><tr><td colspan=7 class=m style="font-size:11px;white-space:normal">${esc(c.signal)}</td></tr>`).join("")}</table>`;
const T=(d.trades||[]).slice().reverse();E("tr").innerHTML=T.length?`<table><tr><th>Time</th><th>Side</th><th>Symbol</th><th>Price</th><th>Qty</th><th>P/L</th></tr>${T.map(t=>`<tr class="rb ${t.side=="BUY"?"lb-b":"lb-s"}"><td>${new Date(t.time).toLocaleString()}</td><td><span class="pill ${t.side=="BUY"?"pb":"ps"}">${t.side}</span></td><td><b>${t.symbol}</b> <span class=m>${t.strategy}</span></td><td>${$$(t.price)}</td><td>${t.qty}</td><td class=${+t.pnl_usd>=0?"g":"r"}>${t.pnl_usd?$$(t.pnl_usd)+" ("+t.pnl_pct+"%)":""}</td></tr><tr><td colspan=6 class=m style="font-size:11px;white-space:normal">Why: ${esc(t.reason)}</td></tr>`).join("")}</table>`:"<p class=m>No trades yet. Entries are queued by the after-close scan and filled at the next session's price.</p>";
const K=(d.kills||[]).slice(-40).reverse();E("kl").innerHTML=K.length?`<table><tr><th>Time</th><th>Symbol</th><th>Rule</th><th>Detail</th></tr>${K.map(k=>`<tr class="rb lb-f"><td>${new Date(k.time).toLocaleString()}</td><td>${esc(k.symbol)}</td><td><span class="pill pf">${esc(k.rule)}</span></td><td class=m>${esc(k.detail)}</td></tr>`).join("")}</table>`:"<p class=m>None.</p>";
}catch(e){E("upd").textContent="load error"}}go();setInterval(go,60000)
</script><script src="nav.js"></script></body></html>
