<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunny AI · Agent</title>
<style>
:root{--bg:#07090d;--card:#0f131a;--line:#1c222c;--mut:#7b8594;--g:#22e08a;--r:#ff4d5e;--t:#e7ecf3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
.wrap{max-width:1000px;margin:auto;padding:16px}.banner{background:#2a1a00;color:#ffb020;border:1px solid #5a3a00;border-radius:8px;padding:6px 10px;text-align:center;font-weight:700;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}.hd{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
a.back{color:var(--mut);text-decoration:none;display:inline-block;margin-top:12px}.g{color:var(--g)}.r{color:var(--r)}.m{color:var(--mut)}
.top{display:flex;gap:14px;align-items:center}.ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px}
h1{margin:0;font-size:26px}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}td,th{padding:6px 5px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:500}
.tag{font-size:9px;padding:1px 4px;border-radius:4px;background:#1c2533;color:#8fb3ff}ul{padding-left:18px;margin:6px 0}li{margin:3px 0}pre{white-space:pre-wrap;margin:0;color:#c5ccd6}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.nav a{font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--t);text-decoration:none}
</style></head><body><div class="wrap">
<div class="banner">⚠ PAPER / SIMULATED ONLY · NO REAL MONEY · NO WALLETS · NO EXCHANGE CONNECTIONS</div>
<a class="back" href="./">← Back to Sunny AI desk</a>
<div class="card"><div class="top"><div class="ic" id="ic"></div><div><h1 id="nm"></h1><div class="m" id="act"></div></div></div>
<p id="what"></p><div class="hd">Exact rules</div><ul id="rules"></ul><div class="nav" id="nav"></div></div>
<div id="body"></div><p class="m" style="font-size:11px;text-align:center" id="upd"></p></div>
<script>
const AG={
scout:["Scout","🔭","#3b82f6","Finds brand-new Solana trading pairs every cycle. It looks at real public DexScreener data plus the clearly-labeled SIM-FEED (synthetic Pump.fun/Raydium pairs), and only hands forward pairs in the right age and size window.",["Pair age 30 minutes to 72 hours","Market cap $300k to $20M","Solana only (DexScreener token profiles, boosts, search)","Each token checked once; tagged REAL-DATA or SIM-FEED"]],
filter:["Filter","🛡️","#ef4444","Safety gate. Runs 8 hard kill rules; one hit and the token is dead. Missing data is a kill too (never guessed).",["Mint or freeze authority not revoked","LP not burned/locked (≥95%)","Liquidity < $40k","1h volume < $50k","Top 10 holders > 25% (pool accounts excluded)","Dev holds > 3% or past rugs","Bundled/insider launch > 10%","Already +80% in 1h","Field unavailable → 'Data unavailable' kill"]],
analyst:["Analyst","🧠","#a855f7","Scores survivors 0–100 from six factors. Only 70+ moves on.",["Momentum (1h price change) — 25 pts","Unique buyers (≈ 1h buy txns, no free wallet data) — 20","Buy/sell ratio — 20","Holder growth vs last seen — 15 (neutral first time)","Liquidity / market cap — 20","Smart wallets — 0 (no free source)","Score ≥ 70 passes"]],
judge:["Judge","⚖️","#eab308","Deterministic checklist (no AI). Reads a facts-only dossier and answers fixed yes/no questions. Missing fields earn zero. Confidence never changes trade size.",["Liquidity stable/rising since first seen — 0.15","Buys spread across many wallets — 0.10","Price NOT up >50% in 5m — 0.15 (red flag)","LP lock ≥ 99% — 0.15 (red flag)","Holder count rising — 0.10","Sells > 0 in 1h — 0.15 (red flag)","Pair age > 1h — 0.10","No missing critical field — 0.10 (red flag)","Pass only if p ≥ 0.65 and no red flag"]],
executor:["Executor","⚡","#22c55e","Places simulated buys for Judge-approved tokens with realistic fills: delay, AMM slippage, dropped transactions, and fees.",["Max 8% of equity per trade; size never depends on confidence","One entry per token, never average down","Venue: Pump.fun curve (1% fee), Raydium AMM (0.25%), Jupiter route","0.5–8s delay, re-priced at fill","Slippage tolerance 3% → failed fill if exceeded","~4–10% random dropped tx (still pays network+priority fee)"]],
risk:["Risk","🎯","#f59e0b","Protects the paper balance. Checks every open position each cycle against live/sim prices.",["−6% hard stop set before entry","After +12% gain, trailing stop = 94% of highest price","Stops fill with slippage (can gap below stop)","Stop exit tolerance 15%; failed exits retry next cycle"]],
logger:["Logger","📒","#14b8a6","Writes everything down: every kill with its exact rule, every trade attempt, Judge decisions, and a morning recap.",["Every kill → kills.json with rule + detail","Every fill/fail → trades_v2.csv","Every Judge decision → judge_log.csv","Morning recap on first run after 7 AM CT"]]};
const q=(new URLSearchParams(location.search).get("a")||"scout").toLowerCase(),A=AG[q]||AG.scout,$=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])),f=n=>"$"+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2}),
pr=n=>n==null||n===""?"—":Number(n).toPrecision(4),tg=s=>s=="MAJOR"?`<span class=tag style="background:#2a1f05;color:#ffcf5c">MAJOR</span>`:`<span class=tag style="background:#0c2a1c;color:#22e08a">SOLANA</span> <span class=tag>${s=="SIM-FEED"?"SIM":"REAL"}</span>`,tm=t=>t?new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):"",
card=(h,x)=>`<div class=card><div class=hd>${h}</div><div class=tw>${x}</div></div>`,tbl=(H,R)=>`<table><tr>${H.map(h=>`<th>${h}</th>`).join("")}</tr>${R.length?R.join(""):`<tr><td colspan=${H.length} class=m>none yet</td></tr>`}</table>`;
document.title="Sunny AI · "+A[0];$("nm").textContent=A[0];$("nm").style.color=A[2];$("ic").textContent=A[1];$("ic").style.background=A[2]+"22";$("what").textContent=A[3];$("rules").innerHTML=A[4].map(r=>`<li>${esc(r)}</li>`).join("");
$("nav").innerHTML=Object.entries(AG).map(([k,v])=>`<a href="agent.html?a=${k}" style="${k==q?"border-color:"+v[2]:""}">${v[1]} ${v[0]}</a>`).join("");
function calib(c){return tbl(["Judge p","Trades","Win rate"],[[0.65,0.75],[0.75,0.85],[0.85,1.01]].map(([a,b])=>{const t=c.filter(x=>x.judge_p>=a&&x.judge_p<b),w=t.filter(x=>x.win).length;return`<tr><td>${a}–${Math.min(b,1)}</td><td>${t.length}</td><td>${t.length?Math.round(w/t.length*100)+"%":"—"}</td></tr>`}))}
const tradeRows=T=>T.map(t=>`<tr><td class=m>${tm(t.time)}</td><td class=${t.side=="BUY"?"g":"r"}>${t.side}</td><td>$${esc(t.symbol)} ${tg(t.source)}</td><td class=m>${esc(t.venue)}</td><td>${pr(t.intended)}→${pr(t.filled)}</td><td>${(+t.slip_pct).toFixed(2)}%</td><td>${t.delay_s}s</td><td>${f(t.fees_usd)}</td><td class=${t.status=="FILLED"?"g":"r"}>${esc(t.status)}</td><td>${f(t.usd)}</td><td class=${+t.pnl_usd>=0?"g":"r"}>${t.pnl_usd?f(t.pnl_usd):""}</td><td class=m>${esc(t.reason)}</td></tr>`);
const TH=["Time","Side","Token","Venue","Intended→Filled","Slip","Delay","Fees","Status","USD","P/L","Note"];
const killRows=K=>K.map(k=>`<tr><td class=m>${tm(k.time)}</td><td>$${esc(k.symbol)} ${tg(k.source)}</td><td class=r>✕ ${esc(k.rule)}</td><td class=m>${esc(k.detail)}</td></tr>`);
const R={
scout:d=>card(`Recent pairs found (${d.scout.length})`,tbl(["Seen","Token","Dex","Age h","Mcap","Liq","1h vol","1h %"],d.scout.map(c=>`<tr><td class=m>${tm(c.time)}</td><td>$${esc(c.symbol)} ${tg(c.source)}</td><td>${esc(c.dex)}</td><td>${c.age_h}</td><td>${f(c.mcap)}</td><td>${f(c.liq)}</td><td>${f(c.vol_h1)}</td><td class=${c.chg_h1>=0?"g":"r"}>${(+c.chg_h1||0).toFixed(1)}%</td></tr>`))),
filter:d=>card("Kills by rule",tbl(["Rule","Count"],Object.entries(d.kill_rules).sort((a,b)=>b[1]-a[1]).map(([r,n])=>`<tr><td>${esc(r)}</td><td class=r>${n}</td></tr>`)))+card("Recent kills",tbl(["Time","Token","Rule","Detail"],killRows(d.kills.slice(0,80)))),
analyst:d=>card("Recent scores",tbl(["Time","Token","Score","Result","Mom","Buyers","B/S","Holders","Liq/Mc","Smart"],d.analyst.map(a=>`<tr><td class=m>${tm(a.time)}</td><td>$${esc(a.symbol)} ${tg(a.source)}</td><td><b>${a.score}</b></td><td class=${a.pass?"g":"r"}>${a.pass?"PASS":"FAIL"}</td>${["momentum","unique_buyers","buy_sell","holder_growth","liq_mcap","smart_wallets"].map(k=>`<td>${a.parts[k]}</td>`).join("")}</tr>`))),
judge:d=>card("Calibration (win rate by probability)",calib(d.calibration))+card(`Recent dossiers (${d.dossiers.length})`,tbl(["Time","Token","p","Decision","Answers","Reason"],d.dossiers.map(x=>{const j=x.judge||{};return`<tr><td class=m>${tm(x.time)}</td><td>$${esc(x.symbol)}</td><td>${j.probability}</td><td class=${j.result=="PASS"?"g":"r"}>${j.result}</td><td>${Object.entries(j.answers||{}).map(([k,v])=>`<span class=${v===true?"g":v===false?"r":"m"}>${k}:${v===true?"Y":v===false?"N":"miss"}</span>`).join(" ")}</td><td class=m>${esc(j.reason)}</td></tr>`}))),
executor:d=>{const B=d.trades.filter(t=>t.side=="BUY"),F=B.filter(t=>t.status=="FILLED"),av=F.length?F.reduce((a,t)=>a+ +t.slip_pct,0)/F.length:0;return card("Execution stats",`fills ${F.length} · <span class=r>failed ${d.failed_fills}</span> · avg buy slippage ${av.toFixed(2)}% · fees ${f(d.fees_paid)}`)+card("Buy attempts",tbl(TH,tradeRows(B)))},
risk:d=>{const P=Object.entries(d.positions);return card("Open positions",tbl(["Token","Entry","Last","Stop","Trail","To stop","P/L"],P.map(([m,p])=>{const r=p.last/p.entry-1;return`<tr><td>$${esc(p.symbol)} ${tg(p.source)}</td><td>${pr(p.entry)}</td><td>${pr(p.last)}</td><td>${pr(p.stop)}</td><td>${p.trailing?"<span class=g>trailing</span>":"hard −6%"}</td><td>${((p.last/p.stop-1)*100).toFixed(1)}%</td><td class=${r>=0?"g":"r"}>${(r*100).toFixed(1)}%</td></tr>`})))+card("Recent stop-outs",tbl(TH,tradeRows(d.trades.filter(t=>t.side=="SELL"))))},
logger:d=>card("Latest morning recap",`<pre>${esc(d.recap||"First recap after 7 AM CT.")}</pre>`)+card(`Full trade log (${d.trades.length})`,tbl(TH,tradeRows(d.trades)))+card("Kill log",tbl(["Time","Token","Rule","Detail"],killRows(d.kills)))};
async function go(){try{const d=await (await fetch("data/agents.json?"+Date.now())).json();$("act").textContent=d.activity[A[0]]||"";$("body").innerHTML=(R[q]||R.scout)(d);$("upd").textContent="PAPER / SIMULATED ONLY · updated "+tm(d.updated)+" · auto-refresh 30s"}catch(e){$("upd").textContent="load error"}}
go();setInterval(go,30000);
</script></body></html>
